version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unconvert
    - unused
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  govet:
    enable:
      - nilness
      - shadow
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
