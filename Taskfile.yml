version: "3"

vars:
  BIN: /tmp/gitdash-server
  PYTEST_BIN: /tmp/gitdash-server-pytest
  UI_BIN: /tmp/gitdash-server-ui

tasks:
  default:
    desc: 显示可用任务
    cmds:
      - task --list

  # ---------- 构建 ----------
  frontend:
    desc: 构建前端
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  swagger:
    desc: 重新生成 OpenAPI 文档（修改 API 注解后运行）
    dir: backend
    cmds:
      - go run github.com/swaggo/swag/cmd/swag init -g internal/api/doc.go -o internal/api/docs
    sources:
      - internal/api/**/*.go
    generates:
      - internal/api/docs/docs.go

  proto:
    desc: 重新生成授权面 gRPC 代码（修改 proto 后运行）
    dir: backend
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - PATH="$PATH:$(go env GOPATH)/bin" go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - internal/grpcserver/authzv1/*.pb.go

  backend:
    desc: 构建后端二进制（不内嵌前端）
    deps: [swagger, agent]
    cmds:
      - go build -o {{.BIN}} .
    dir: backend
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - /tmp/gitdash-server

  agent:
    desc: 构建 copilot agent 运行时（deps/agent）到 /tmp/agent
    dir: deps/agent
    cmds:
      - go build -o /tmp/agent ./cmd/agent
    sources:
      - "**/*.go"
    generates:
      - /tmp/agent

  cli:
    desc: 构建命令行客户端 gitdash-cli 到 /tmp/gitdash-cli
    dir: backend
    cmds:
      - go build -o /tmp/gitdash-cli ./cmd/gitdash-cli
    sources:
      - "**/*.go"
    generates:
      - /tmp/gitdash-cli

  # ---------- 测试 ----------
  test:go:
    desc: 后端 Go 测试（含功能测试套件）
    dir: backend
    cmds:
      - go vet ./...
      - go test ./...

  test:api:
    desc: 黑盒 API 测试（pytest，需 uv；单独构建被测二进制）
    deps: [build:pytest-bin, agent]
    dir: tests
    cmds:
      - uv run pytest -q
    env:
      GITDASH_BIN: "{{.PYTEST_BIN}}"
      GITDASH_AGENT_BIN: /tmp/agent

  build:pytest-bin:
    deps: [swagger]
    cmds:
      - go build -o {{.PYTEST_BIN}} .
    dir: backend
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - /tmp/gitdash-server-pytest

  test:ui:
    desc: 黑盒 E2E UI 测试（Playwright + headless Chrome，独立 tests/ui 目录）
    deps: [build:ui-bin]
    dir: tests/ui
    cmds:
      - npm install
      - npx playwright test
    env:
      GITDASH_BIN: "{{.UI_BIN}}"

  build:ui-bin:
    desc: 构建带内嵌前端的被测二进制（UI 测试用）
    deps: [frontend]
    cmds:
      - rm -rf internal/webui/dist
      - mkdir -p internal/webui/dist
      - cp -r ../frontend/dist/. internal/webui/dist/
      - touch internal/webui/dist/.gitkeep
      - go build -trimpath -o {{.UI_BIN}} .
    dir: backend
    generates:
      - "{{.UI_BIN}}"

  test:frontend:
    desc: 前端类型检查 + 构建
    dir: frontend
    cmds:
      - pnpm run build

  test:e2e:
    desc: E2E 冒烟测试（SSH clone/push + 浏览）
    cmds:
      - bash scripts/e2e.sh

  test:
    desc: 一键全量测试（Go + 前端 + E2E）
    cmds:
      - task: test:go
      - task: test:frontend
      - task: test:e2e

  test:all:
    desc: 一键全量测试 + 黑盒 API 测试 + E2E UI 测试（含 pytest/Playwright，较慢）
    cmds:
      - task: test
      - task: test:api
      - task: test:ui

  # ---------- 本地部署 ----------
  deploy:
    desc: 一键本地部署（构建前端 + 后端内嵌前端 + 启动，http://localhost:8080，SSH :2222）
    cmds:
      - task: frontend
      - task: build:embed
      - task: run

  build:embed:
    desc: 构建内嵌前端的二进制（embed-frontend.sh 已含前端构建）
    cmds:
      - bash scripts/embed-frontend.sh
      - go build -trimpath -o gitdash-server .
      - cd ../deps/agent && go build -o ../../backend/agent ./cmd/agent
    dir: backend

  run:
    desc: 启动本地实例（数据目录 .data，端口 8080/2222）
    cmds:
      - ./gitdash-server serve
    env:
      GITDASH_DATA: "{{.DATA_DIR | default \"./.data\"}}"
    vars:
      DATA_DIR: "{{.DATA_DIR | default \"./.data\"}}"

  deploy:docker:
    desc: 一键 Docker 部署（构建镜像 + docker compose up -d）
    cmds:
      - docker compose up -d --build

  deploy:down:
    desc: 停止 Docker 部署
    cmds:
      - docker compose down

  # ---------- 覆盖率 ----------
  coverage:go:
    desc: 后端单元测试覆盖率（输出 /tmp/gitdash-go-coverage.out/.html）
    dir: backend
    cmds:
      - go test ./... -covermode=atomic -coverprofile=/tmp/gitdash-go-coverage.out
      - go tool cover -func=/tmp/gitdash-go-coverage.out | tail -1
      - go tool cover -html=/tmp/gitdash-go-coverage.out -o /tmp/gitdash-go-coverage.html

  coverage:blackbox:
    desc: 黑盒（API+UI）集成覆盖率（GOCOVERDIR，输出 /tmp/gitdash-blackbox-coverage.out）
    cmds:
      - bash scripts/coverage-blackbox.sh

  # ---------- 清理 ----------
  clean:
    desc: 清理构建产物和本地数据目录
    cmds:
      - rm -f gitdash-server /tmp/gitdash-server /tmp/gitdash-server-pytest
      - rm -rf .data
