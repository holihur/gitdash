name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 包管理器发布（缺省为空时 goreleaser 自动跳过对应 publisher）
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      # 文档站（Hugo）编译 + Pagefind 索引，打包为单个制品附加到本次 release。
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build documentation site
        run: |
          # 可移植构建：相对链接 + 根 baseURL，部署到任意域名/子路径均可。
          # 在首行插入，避免落到 hugo.toml 末尾的 [languages.*] 表内。
          sed -i '1i relativeURLs = true' docs/hugo.toml
          hugo --source docs --minify --baseURL /
          npx --yes pagefind@1.3.0 --site docs/public

      - name: Package documentation site
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf /tmp/gitdash-docs
          cp -r docs/public /tmp/gitdash-docs
          tar -czf "gitdash-docs_${VERSION}.tar.gz" -C /tmp gitdash-docs
          ls -lh "gitdash-docs_${VERSION}.tar.gz"

      - name: Upload documentation to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" gitdash-docs_*.tar.gz --clobber
