name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的连续推送取消旧任务，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitdash
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: gitdash
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gitdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      # shadow 只检查新代码（HEAD~1 之后的变更），存量代码不阻断
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./... -covermode=atomic -coverprofile=/tmp/coverage-unit.out 2>&1 | tee /tmp/test.log; exit ${PIPESTATUS[0]}

      - name: Upload unit-test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/coverage-unit.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test PostgreSQL (store smoke)
        working-directory: backend
        run: GITDASH_DB="postgres://gitdash:pg@127.0.0.1:54329/gitdash?sslmode=disable" go test ./internal/store/pgsmoketest/ -count=1 -v 2>&1 | tee /tmp/test-pg.log; exit ${PIPESTATUS[0]}

      - name: Report failing tests
        if: failure()
        run: |
          grep -o -- "--- FAIL: [^ ]*" /tmp/test.log | sed "s/^/::error::/" || true
          {
            echo "## go test tail"
            echo '```'
            tail -c 20000 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build server binary (with coverage instrumentation for black-box tests)
        working-directory: backend
        run: go build -cover -o gitdash-server .

      - name: E2E (create repo, ssh clone/push, browsing)
        run: bash scripts/e2e.sh

      - name: Upload server binary (reused by api-tests)
        uses: actions/upload-artifact@v4
        with:
          name: gitdash-server
          path: backend/gitdash-server
          retention-days: 1

  api-tests:
    name: API tests (pytest · uv, black-box)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitdash
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: gitdash
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gitdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download server binary (built by backend job)
        uses: actions/download-artifact@v4
        with:
          name: gitdash-server
          path: /tmp

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Prepare coverage dir
        run: mkdir -p /tmp/gocover-api

      - name: Run black-box API tests (happy + bad paths)
        working-directory: tests
        run: chmod +x /tmp/gitdash-server && uv run pytest -v
        env:
          GITDASH_BIN: /tmp/gitdash-server
          GOCOVERDIR: /tmp/gocover-api

      - name: Run black-box API tests against PostgreSQL
        working-directory: tests
        run: chmod +x /tmp/gitdash-server && uv run pytest -v --tb=short
        env:
          GITDASH_BIN: /tmp/gitdash-server
          GITDASH_DB: postgres://gitdash:pg@127.0.0.1:54329/gitdash?sslmode=disable
          GOCOVERDIR: /tmp/gocover-api

      - name: Report black-box (API) coverage
        working-directory: backend
        run: |
          go tool covdata percent -i=/tmp/gocover-api | tail -1
          go tool covdata textfmt -i=/tmp/gocover-api -o /tmp/coverage-api.out

      - name: Upload black-box (API) coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/coverage-api.out
          flags: blackbox-api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t gitdash:ci .
      - name: Smoke test container
        run: |
          docker run -d --name gitdash-smoke -e GITDASH_HTTP_ADDR=:18080 -e GITDASH_SSH_ADDR=:18222 gitdash:ci
          for i in $(seq 1 40); do
            docker exec gitdash-smoke curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec gitdash-smoke curl -fsS http://127.0.0.1:18080/api/version
          docker stop gitdash-smoke >/dev/null && docker rm gitdash-smoke >/dev/null

  frontend:
    name: Frontend (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test (vitest)
        working-directory: frontend
        run: pnpm run test

      - name: Build (tsc + vite)
        working-directory: frontend
        run: pnpm run build

  ui-tests:
    name: E2E UI tests (Playwright · black-box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      # 构建带内嵌前端 + 覆盖率插桩的被测二进制
      - name: Build embedded frontend + instrumented server binary
        run: |
          pnpm install --frozen-lockfile --dir frontend
          (cd frontend && pnpm run build)
          rm -rf backend/internal/webui/dist
          mkdir -p backend/internal/webui/dist
          cp -r frontend/dist/. backend/internal/webui/dist/
          touch backend/internal/webui/dist/.gitkeep
          (cd backend && go build -cover -o /tmp/gitdash-server-ui .)

      - name: Run black-box UI tests
        working-directory: tests/ui
        run: |
          mkdir -p /tmp/gocover-ui
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          GITDASH_BIN: /tmp/gitdash-server-ui
          GOCOVERDIR: /tmp/gocover-ui

      - name: Report black-box (UI) coverage
        working-directory: backend
        run: |
          go tool covdata percent -i=/tmp/gocover-ui | tail -1
          go tool covdata textfmt -i=/tmp/gocover-ui -o /tmp/coverage-ui.out

      - name: Upload black-box (UI) coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/coverage-ui.out
          flags: blackbox-ui
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ui/test-results
          retention-days: 3
