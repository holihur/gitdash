name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的连续推送取消旧任务，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      # shadow 只检查新代码（HEAD~1 之后的变更），存量代码不阻断
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: --new-from-rev=HEAD~1

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Build server binary
        working-directory: backend
        run: go build -o gitdash-server .

      - name: E2E (create repo, ssh clone/push, browsing)
        run: bash scripts/e2e.sh

      - name: Upload server binary (reused by api-tests)
        uses: actions/upload-artifact@v4
        with:
          name: gitdash-server
          path: backend/gitdash-server
          retention-days: 1

  api-tests:
    name: API tests (pytest · uv, black-box)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download server binary (built by backend job)
        uses: actions/download-artifact@v4
        with:
          name: gitdash-server
          path: /tmp

      - name: Run black-box API tests (happy + bad paths)
        working-directory: tests
        run: uv run pytest -v
        env:
          GITDASH_BIN: /tmp/gitdash-server

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t gitdash:ci .
      - name: Smoke test container
        run: |
          docker run -d --name gitdash-smoke -e GITDASH_HTTP_ADDR=:18080 -e GITDASH_SSH_ADDR=:18222 gitdash:ci
          for i in $(seq 1 40); do
            docker exec gitdash-smoke curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec gitdash-smoke curl -fsS http://127.0.0.1:18080/api/version
          docker stop gitdash-smoke >/dev/null && docker rm gitdash-smoke >/dev/null

  frontend:
    name: Frontend (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (tsc + vite)
        working-directory: frontend
        run: pnpm run build
