name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          working-directory: backend

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: E2E (create repo, ssh clone/push, browsing)
        run: bash scripts/e2e.sh

  api-tests:
    name: API tests (pytest · uv, black-box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build server binary (isolated black-box target)
        working-directory: backend
        run: go build -o /tmp/gitdash-server .

      - name: Run black-box API tests (happy + bad paths)
        working-directory: tests
        run: uv run pytest -v
        env:
          GITDASH_BIN: /tmp/gitdash-server

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gitdash:ci .
      - name: Smoke test container
        run: |
          docker run -d --name gitdash-smoke -e GITDASH_HTTP_ADDR=:18080 -e GITDASH_SSH_ADDR=:18222 gitdash:ci
          for i in $(seq 1 40); do
            docker exec gitdash-smoke curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec gitdash-smoke curl -fsS http://127.0.0.1:18080/api/version
          docker stop gitdash-smoke >/dev/null && docker rm gitdash-smoke >/dev/null

  frontend:
    name: Frontend (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
