# Codecov 配置（issue #4 P3.11）
#
# 从「只看总量覆盖」收紧为「新增代码覆盖率门禁」：patch 覆盖不足会标记失败，
# 防止新代码零测试合并；project 允许相对基线轻微波动。
coverage:
  status:
    project:
      default:
        # 分阶段目标：最终 80%。达标前 informational（不阻断），
        # 作为进度信号；Go 单测覆盖率按阶段爬坡（见 docs/content/en/developer/coverage.md）。
        target: 80%
        threshold: 1%
        informational: true
    patch:
      default:
        # 新代码整体提升门槛，避免低覆盖代码入库。
        target: 80%
        threshold: 0%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "backend/internal/api/docs/**"
  - "frontend/src/locales/**"
  - "**/*.d.ts"
