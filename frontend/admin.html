<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gitdash Admin</title>
    <script>
      // 主题预置（与主应用一致，避免首帧闪烁）
      (function () {
        try {
          var t = localStorage.getItem("gitdash-theme");
          var dark =
            t === "dark" ||
            ((t === "system" || !t) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
