services:
  gitdash:
    build: .
    image: gitdash:local
    container_name: gitdash
    restart: unless-stopped
    ports:
      - "8080:8080" # Web / API
      - "2222:2222" # Git over SSH
    environment:
      # 数据目录（镜像内固定 /data，如需自定义改下面 volumes 映射即可）
      GITDASH_DATA: /data
      # 需要自动更新时取消注释（仅正式发布版生效）：
      # GITDASH_AUTO_UPDATE: "1"
    volumes:
      - gitdash-data:/data
    # 数据一致 + 便于备份；如需替换默认监听端口可在此覆盖：
    # GITDASH_HTTP_ADDR: ":8080"
    # GITDASH_SSH_ADDR: ":2222"

volumes:
  gitdash-data:
