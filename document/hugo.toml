# gitdash documentation site (Hugo). Deployed independently: `hugo` writes public/.
baseURL = "https://holihur.github.io/gitdash/"
title = "gitdash Docs"
languageCode = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 30

[params]
  gitdashRepo = "https://github.com/holihur/gitdash"
  description = "Documentation for the self-hosted Git service gitdash, organized by module and feature."

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]

# English is the primary language and is served from the site root.
# Chinese is fully translated; the remaining languages fall back to the
# English content (same contentDir) until translations are contributed.
[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    title = "gitdash Docs"
    contentDir = "content/en"
    [languages.en.params]
      description = "Documentation for the self-hosted Git service gitdash, organized by module and feature."
      docsLabel = "Docs"
  [languages.zh-cn]
    languageName = "中文"
    languageCode = "zh-CN"
    weight = 2
    title = "gitdash 文档"
    contentDir = "content/zh-cn"
    [languages.zh-cn.params]
      description = "自托管 Git 服务 gitdash 的使用文档：按模块与功能组织。"
      docsLabel = "文档"
  [languages.ja]
    languageName = "日本語"
    weight = 3
    contentDir = "content/en"
  [languages.ko]
    languageName = "한국어"
    weight = 4
    contentDir = "content/en"
  [languages.fr]
    languageName = "Français"
    weight = 5
    contentDir = "content/en"
  [languages.de]
    languageName = "Deutsch"
    weight = 6
    contentDir = "content/en"
  [languages.ru]
    languageName = "Русский"
    weight = 7
    contentDir = "content/en"
  [languages.es]
    languageName = "Español"
    weight = 8
    contentDir = "content/en"
  [languages.pt]
    languageName = "Português"
    weight = 9
    contentDir = "content/en"
