<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.LanguageCode | default .Language.Lang }}" href="{{ .Permalink }}">
{{ if eq .Language.Lang "en" }}<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">{{ end }}
{{ end }}
<script>
  // 与前端一致：gitdash-theme = light | dark | system（默认 system）。
  (function () {
    try {
      var t = localStorage.getItem("gitdash-theme") || "system";
      var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
<script defer src="{{ "js/theme.js" | relURL }}"></script>
<script>window.__gitdashPagefind = {{ "pagefind/" | relURL }};</script>
<script defer src="{{ "js/search.js" | relURL }}"></script>
{{ block "head" . }}{{ end }}
