version: 2

before:
  hooks:
    - sh -c "cd backend && go mod tidy"
    - bash scripts/embed-frontend.sh

builds:
  - id: gitdash
    dir: backend
    main: .
    binary: gitdash
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
  # 自托管 CI agent（runner）
  - id: gitdash-runner
    dir: backend
    main: ./cmd/gitdash-runner
    binary: gitdash-runner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
  # 命令行客户端（PAT / OAuth 2.0 设备流登录）
  - id: gitdash-cli
    dir: backend
    main: ./cmd/gitdash-cli
    binary: gitdash-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.cliVersion={{ .Version }}
  # Copilot agent 运行时（deps/agent 子模块，实现 copilot-api/1）
  # 注意：agent 的 internal/mdns 与 internal/ui/cli 目前只在 linux 编译，
  # 故仅随 linux 归档发布；其它平台可用 GITDASH_COPILOT_AGENT_BIN 自行构建。
  - id: agent
    dir: deps/agent
    main: ./cmd/agent
    binary: agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # agent 仅随 linux 发布（其余平台无 agent 源），各平台二进制数不同。
    allow_different_binary_count: true
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - packaging/gitdash.service

checksum:
  name_template: checksums.txt

# 系统包（apt / yum / apk 直接安装）
nfpms:
  - id: packages
    package_name: gitdash
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    builds:
      - gitdash
      - gitdash-runner
      - gitdash-cli
    formats:
      - deb
      - rpm
      - apk
    vendor: gitdash
    homepage: "https://github.com/holihur/gitdash"
    maintainer: "holihur"
    description: "A minimal self-hosted Git service (http + ssh + web ui)"
    license: MIT
    # 运行依赖 git（SSH 推送/浏览等都调用 git），适用于 deb/rpm/apk
    dependencies:
      - git
    contents:
      # systemd 服务（deb/rpm），安装后 systemctl enable --now gitdash
      - src: packaging/gitdash.service
        dst: /usr/lib/systemd/system/gitdash.service
      - type: dir
        file_info:
          mode: 0755
        dst: /var/lib/gitdash
      - type: dir
        file_info:
          mode: 0755
        dst: /etc/gitdash
    scripts:
      # rpm 的 post 脚本同样适用于 deb/apk（goreleaser 会按格式使用）
      postinstall: packaging/postinstall.sh

# 包管理器发布（Homebrew/Scoop/Nix/AUR）暂未启用：
#   - 需先创建对应仓库（homebrew-tap / scoop-bucket / nur-packages）与 secret
#   - AUR 为 goreleaser Pro 专属功能
# 待仓库就绪后参考 https://goreleaser.com/customization 部分恢复

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
